# configs/train.yaml
seed: 42

training:
  batch_size: 4
  num_workers: 2
  learning_rate: 1.0e-4
  weight_decay: 0.05
  max_epochs: 20
  precision: "32-true"

baselines:
  unet:
    epochs: 10
    lr: 1.0e-3
    batch_size: 4
    patience: 3

logging:
  use_wandb: false
  project: "ocean-deja-vu"
  log_every_n_steps: 10
